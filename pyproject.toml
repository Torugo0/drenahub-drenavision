[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drenavision"
version = "0.5.0"
description = "Visao computacional para triagem assistida de riscos em drenagem urbana."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "DrenaHub" }]
dependencies = [
  "fastapi==0.163.1",
  "faster-coco-eval==1.8.0",
  "lap==0.5.14",
  "httpx==0.28.1",
  "huggingface-hub==0.36.0",
  "imageio-ffmpeg==0.8.1",
  "numpy==2.2.6",
  "opencv-python==4.14.0.94",
  "Pillow==12.0.0",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.3",
  "python-multipart==0.0.34",
  "PyYAML==6.0.3",
  "remotezip==0.12.3",
  "regex==2025.11.3",
  "safetensors==0.7.0",
  "streamlit==1.67.0",
  "torch==2.14.1",
  "torchvision==0.29.1",
  "tokenizers==0.22.1",
  "tqdm==4.67.1",
  "transformers==4.57.3",
  "ultralytics==8.4.215",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-cov==7.0.0",
  "ruff==0.17.5",
]
report = [
  "reportlab==4.4.9",
  "pypdf==6.21.4",
  "pypdfium2==5.13.0",
]

[tool.setuptools.packages.find]
include = ["drenavision*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["ferramentas/tests"]
cache_dir = "resultados/local/cache/pytest"
markers = [
  "integration: exercises optional heavyweight or service integrations",
]

[tool.ruff]
target-version = "py311"
line-length = 88
cache-dir = "resultados/local/cache/ruff"
extend-exclude = ["dados", "resultados", "runs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"docs/*.ipynb" = ["E402", "I001"]

